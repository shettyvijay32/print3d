apiVersion: v1
kind: Service
metadata:
  name: printora-api
  namespace: printora3d
spec:
  selector: { app: printora-api }
  ports:
    - name: http
      port: 4000
      targetPort: 4000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: printora-api
  namespace: printora3d
spec:
  replicas: 1
  selector:
    matchLabels: { app: printora-api }
  template:
    metadata:
      labels: { app: printora-api }
    spec:
      containers:
        - name: api
          image: vijaytechnologies/print3dapp-api:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 4000
          env:
            - name: PORT
              value: "4000"
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: printora-secrets, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: printora-secrets, key: POSTGRES_PASSWORD } }
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: printora-secrets, key: POSTGRES_DB } }
            - name: DATABASE_URL
              value: postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: printora-secrets, key: JWT_SECRET } }
            - name: ADMIN_EMAIL
              valueFrom: { secretKeyRef: { name: printora-secrets, key: ADMIN_EMAIL } }
            - name: ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: printora-secrets, key: ADMIN_PASSWORD } }
            - name: MINIO_ENDPOINT
              value: minio
            - name: MINIO_PORT
              value: "9000"
            - name: MINIO_USE_SSL
              value: "false"
            - name: MINIO_ROOT_USER
              valueFrom: { secretKeyRef: { name: printora-secrets, key: MINIO_ROOT_USER } }
            - name: MINIO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: printora-secrets, key: MINIO_ROOT_PASSWORD } }
            - name: MINIO_BUCKET
              valueFrom: { secretKeyRef: { name: printora-secrets, key: MINIO_BUCKET } }
          readinessProbe:
            httpGet: { path: /health, port: 4000 }
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 4000 }
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 750m, memory: 512Mi }
