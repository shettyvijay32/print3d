apiVersion: v1
kind: Service
metadata:
  name: printora-admin
  namespace: printora3d
spec:
  selector: { app: printora-admin }
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: printora-admin
  namespace: printora3d
spec:
  replicas: 1
  selector:
    matchLabels: { app: printora-admin }
  template:
    metadata:
      labels: { app: printora-admin }
    spec:
      containers:
        - name: admin
          image: vijaytechnologies/print3dapp-admin:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 300m, memory: 256Mi }
